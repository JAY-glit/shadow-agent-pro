<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="55%" stop-color="#160B08"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8440A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8440A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>

  <g stroke="#E8440A" stroke-opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="260"/><line x1="50" y1="0" x2="50" y2="260"/><line x1="100" y1="0" x2="100" y2="260"/><line x1="150" y1="0" x2="150" y2="260"/><line x1="200" y1="0" x2="200" y2="260"/><line x1="250" y1="0" x2="250" y2="260"/><line x1="300" y1="0" x2="300" y2="260"/><line x1="350" y1="0" x2="350" y2="260"/><line x1="400" y1="0" x2="400" y2="260"/><line x1="450" y1="0" x2="450" y2="260"/><line x1="500" y1="0" x2="500" y2="260"/><line x1="550" y1="0" x2="550" y2="260"/><line x1="600" y1="0" x2="600" y2="260"/><line x1="650" y1="0" x2="650" y2="260"/><line x1="700" y1="0" x2="700" y2="260"/><line x1="750" y1="0" x2="750" y2="260"/><line x1="800" y1="0" x2="800" y2="260"/><line x1="850" y1="0" x2="850" y2="260"/><line x1="900" y1="0" x2="900" y2="260"/><line x1="950" y1="0" x2="950" y2="260"/><line x1="1000" y1="0" x2="1000" y2="260"/><line x1="1050" y1="0" x2="1050" y2="260"/><line x1="1100" y1="0" x2="1100" y2="260"/><line x1="1150" y1="0" x2="1150" y2="260"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="250" x2="1200" y2="250"/>
  </g>

  <ellipse cx="600" cy="130" rx="380" ry="110" fill="url(#glow)"/>

  <!-- radar sweep rings around a shield motif -->
  <g transform="translate(120,130)">
    <circle r="46" fill="none" stroke="#E8440A" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle r="46" fill="none" stroke="#E8440A" stroke-width="1.5" stroke-opacity="0.9">
      <animate attributeName="r" values="20;46;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- shield -->
    <path d="M0,-30 L26,-18 L26,10 C26,28 14,40 0,46 C-14,40 -26,28 -26,10 L-26,-18 Z"
          fill="#0B0E17" stroke="#E8440A" stroke-width="2.5"/>
    <path d="M-12,0 L-3,10 L14,-10" fill="none" stroke="#E8440A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,40;40,0" dur="1.4s" begin="0.5s" fill="freeze"/>
    </path>
  </g>

  <!-- title -->
  <text x="230" y="118" font-family="JetBrains Mono, monospace" font-size="42" font-weight="700" fill="#F5F1E8" letter-spacing="1">
    SHADOW AGENT PRO
  </text>
  <text x="230" y="150" font-family="JetBrains Mono, monospace" font-size="15" fill="#E8440A" letter-spacing="2">
    REAL-TIME MALICIOUS URL DETECTION
  </text>
  <text x="230" y="176" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#9AA3B8" letter-spacing="1">
    Chrome MV3 · Flask API · React Dashboard · ML Ensemble
  </text>

  <!-- scan sweep -->
  <rect x="0" y="0" width="1200" height="70" fill="#E8440A" opacity="0.04">
    <animateTransform attributeName="transform" type="translate" values="0,-70; 0,260" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <line x1="0" y1="259" x2="1200" y2="259" stroke="#E8440A" stroke-opacity="0.5" stroke-width="2"/>
</svg>